services:
  - type: web
    name: crownstealer
    runtime: static
    buildCommand: node scripts/prepare-site.mjs
    staticPublishPath: ./dist
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /downloads/*.apk
        name: Content-Type
        value: application/vnd.android.package-archive
      - path: /downloads/*.apk
        name: Content-Disposition
        value: attachment; filename="CrownStealer.apk"
