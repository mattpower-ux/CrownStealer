<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Updating CrownStealer</title><link rel="stylesheet" href="/style.css"></head><body><main style="max-width:560px;margin:15vh auto;padding:25px"><h1>Updating CrownStealer</h1><p id="status">Loading the latest game files. Your saved adventure stays on this device.</p><a href="/" style="color:#d5b477">Return to the game</a></main><script type="module">
try{
 const registration=await navigator.serviceWorker?.getRegistration();
 if(registration){await registration.update();const worker=registration.installing||registration.waiting;if(worker)await new Promise((resolve,reject)=>{const timer=setTimeout(()=>reject(Error('Update is still downloading. Try again shortly.')),20000);const check=()=>{if(worker.state==='activated'){clearTimeout(timer);resolve();}else if(worker.state==='redundant'){clearTimeout(timer);reject(Error('Update could not finish. Please retry.'));}};worker.addEventListener('statechange',check);check();});}
 location.replace('/');
}catch(error){document.getElementById('status').textContent=error.message+' Your save has not been changed.';}
</script></body></html>
